name: Enterprise CI Pipeline

# ─────────────────────────────────────────────
# Trigger
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

# ─────────────────────────────────────────────
# Default Permissions (Least Privilege)
# ─────────────────────────────────────────────
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  packages: write
  id-token: write

# ─────────────────────────────────────────────
# Prevent Parallel Builds
# ─────────────────────────────────────────────
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────
# Global Environment Variables
# ─────────────────────────────────────────────
env:
  NODE_VERSION: "22"
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "zomato_new"
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ───────────────────────────────────────────
  # JOB 1: Build React Application
  # ───────────────────────────────────────────
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Restore npm Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installed Packages
        run: npm ls || true

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        env:
          CI: true
        run: echo "code is tested"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Build Application
        run: npm link

      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: package*

  # ───────────────────────────────────────────
  # JOB 2: Security & Docker Validation
  # ───────────────────────────────────────────
  security:
    name: Security & Docker Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download React Build
        uses: actions/download-artifact@v4
        with:
          name: artifact-1
          path: .

      # ───────────────────────────────────────
      # Trivy Security Scan
      # ───────────────────────────────────────

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            .

      - name: Verify SARIF
        run: |
          pwd
          ls -la
          find . -name "*.sarif"

      - name: Upload Trivy Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./trivy-fs.sarif

      # ───────────────────────────────────────
      # Dockerfile Validation
      # ───────────────────────────────────────

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # ───────────────────────────────────────
      # AWS OIDC Authentication
      # ───────────────────────────────────────
      - name: Show GitHub OIDC Context
        run: |
               echo "Repository: ${{ github.repository }}"
               echo "Repository ID: ${{ github.repository_id }}"
               echo "Organization: ${{ github.repository_owner }}"
               echo "Ref: ${{ github.ref }}"
               echo "Event: ${{ github.event_name }}"
               echo "Actor: ${{ github.actor }}"
               echo "Owner ID: ${{ github.repository_owner_id }}"
               echo "Repository ID: ${{ github.repository_id }}"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::669375920816:role/github_zomato_role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ───────────────────────────────────────
      # Login to Amazon ECR
      # ───────────────────────────────────────

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # This creates:
      # 123456789012.dkr.ecr.us-east-1.amazonaws.com/zomato_new
      - name: Set ECR Image Name
        run: |
          echo "IMAGE_NAME=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_ENV"

      # ───────────────────────────────────────
      # Docker Build
      # ───────────────────────────────────────

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

          provenance: false
          load: true

          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_id }}

      - name: Update Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ───────────────────────────────────────
      # Verify Docker Image
      # ───────────────────────────────────────

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ───────────────────────────────────────
      # Push Image to Amazon ECR
      # ───────────────────────────────────────

      - name: Push Docker Image to ECR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # ───────────────────────────────────────
      # Smoke Test
      # ───────────────────────────────────────

      - name: Smoke Test Container
        run: |
          docker run -d \
            --name zomato-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 20

          docker ps
          docker logs zomato-test

      # ───────────────────────────────────────
      # Cleanup
      # ───────────────────────────────────────

      - name: Cleanup
        if: always()
        run: docker rm -f zomato-test || true
